# Coverage gates. The project floor is the 75% documented in CLAUDE.md.
coverage:
  status:
    project:
      default:
        target: 75%
        # Fail the check when overall coverage drops more than a point below
        # the last main measurement, even if it is still above the floor.
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 75%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
