name: Feature request
description: Suggest a new diffable resource, output format, or workflow
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you see or do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: |
        If this is a new resource to diff, name the fleet-gitops key and the Fleet
        GET endpoint that exposes current state, plus the field that should act as
        the match key.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: This can be implemented with GET requests only (fleet-plan never mutates Fleet)
          required: true
